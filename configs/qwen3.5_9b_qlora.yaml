# BioReview SFT Training Configuration
# Qwen3.5-9B + QLoRA (4-bit) — MoE architecture
#
# Usage:
#   python scripts/train_sft.py --config configs/qwen3.5_9b_qlora.yaml
#   python scripts/train_sft.py --config configs/qwen3.5_9b_qlora.yaml --dry-run
#   python scripts/train_sft.py --config configs/qwen3.5_9b_qlora.yaml --max-steps 50 --no-eval
#
# Note: Qwen3.5-9B uses sparse MoE. If target_modules fail, check with
#   python -c "from transformers import AutoModelForCausalLM; m = AutoModelForCausalLM.from_pretrained('Qwen/Qwen3.5-9B', device_map='cpu'); print([n for n,_ in m.named_modules() if 'proj' in n][:20])"

model:
  name: "Qwen/Qwen3.5-9B"
  max_seq_length: 16384
  dtype: null
  load_in_4bit: true
  enable_thinking: false           # Disable <think> tags for SFT

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"
  use_gradient_checkpointing: true
  use_rslora: false

training:
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  seed: 42
  logging_steps: 10
  save_strategy: "epoch"
  save_total_limit: 3
  optim: "adamw_8bit"

data:
  train_path: "data/sft_train.jsonl"
  val_path: "data/sft_val.jsonl"

output:
  dir: "models/qwen3.5_9b_bioreview_v1"

inference:
  temperature: 0.1
  max_new_tokens: 4096
  repetition_penalty: 1.05
