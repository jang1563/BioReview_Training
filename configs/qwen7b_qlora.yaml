# BioReview SFT Training Configuration
# Qwen2.5-7B-Instruct + QLoRA (4-bit)
#
# Usage:
#   python scripts/train_sft.py --config configs/qwen7b_qlora.yaml
#   python scripts/train_sft.py --config configs/qwen7b_qlora.yaml --dry-run
#   python scripts/train_sft.py --config configs/qwen7b_qlora.yaml --max-steps 50

model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  max_seq_length: 16384      # 15K input + ~1K output + overhead
  dtype: null                 # auto-detect (bf16 on Ampere+, fp16 otherwise)
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 32              # alpha = 2*r (standard ratio)
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"
  use_gradient_checkpointing: true         # 30% less VRAM vs standard
  use_rslora: false

training:
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8          # effective batch = 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  seed: 42
  logging_steps: 10
  save_strategy: "epoch"
  save_total_limit: 3
  optim: "adamw_8bit"

data:
  train_path: "data/sft_train.jsonl"      # 839 articles (conf=0.7)
  val_path: "data/sft_val.jsonl"          # 186 articles (conf=0.7)

output:
  dir: "models/qwen7b_bioreview_v1"

inference:
  temperature: 0.1
  max_new_tokens: 4096
  repetition_penalty: 1.05
