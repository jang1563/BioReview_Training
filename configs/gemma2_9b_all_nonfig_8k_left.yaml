# BioReview SFT Training Configuration
# Google Gemma-2-9B + QLoRA (4-bit) — 8k retry preserving assistant targets

model:
  name: "/athena/masonlab/scratch/users/jak4013/huggingface/hub/models--unsloth--gemma-2-9b-it-bnb-4bit/snapshots/27b027bcbb6b1861b02551d5c699d5d07f29610a"
  max_seq_length: 8192
  dtype: null
  load_in_4bit: true
  chat_template: "gemma"
  truncation_side: "left"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"
  use_gradient_checkpointing: true
  use_rslora: false

training:
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  seed: 42
  logging_steps: 10
  save_strategy: "epoch"
  save_total_limit: 3
  optim: "adamw_8bit"

data:
  train_path: "data/corpus_all_nonfig/sft_train.jsonl"
  val_path: "data/corpus_all_nonfig/sft_val.jsonl"

output:
  dir: "models/gemma2_9b_all_nonfig_v1_8k_left"

inference:
  temperature: 0.1
  max_new_tokens: 4096
  repetition_penalty: 1.05
