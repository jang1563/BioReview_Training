# BioReview SFT Training Configuration
# Qwen3-8B + QLoRA (4-bit) — Phase 1 high-confidence warm-start corpus

model:
  name: "Qwen/Qwen3-8B"
  max_seq_length: 16384
  dtype: null
  load_in_4bit: true
  enable_thinking: false

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"
  use_gradient_checkpointing: true
  use_rslora: false

training:
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  seed: 42
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 4
  optim: "adamw_8bit"

data:
  train_path: "data/corpus_hi_conf/sft_train.jsonl"
  val_path: "data/corpus_hi_conf/sft_val.jsonl"

output:
  dir: "models/qwen3_8b_hi_conf_v1"

inference:
  temperature: 0.1
  max_new_tokens: 4096
  repetition_penalty: 1.05
