# BioReview SFT Training Configuration
# Qwen2.5-14B-Instruct + QLoRA (4-bit)
#
# Usage:
#   python scripts/train_sft.py --config configs/qwen2.5_14b_qlora.yaml
#   python scripts/train_sft.py --config configs/qwen2.5_14b_qlora.yaml --dry-run
#   python scripts/train_sft.py --config configs/qwen2.5_14b_qlora.yaml --max-steps 50 --no-eval
#
# Note: 14B model requires A100 80GB. Use --no-eval to avoid OOM during evaluation.

model:
  name: "Qwen/Qwen2.5-14B-Instruct"
  max_seq_length: 16384
  dtype: null
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"
  use_gradient_checkpointing: true
  use_rslora: false

training:
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  seed: 42
  logging_steps: 10
  save_strategy: "epoch"
  save_total_limit: 3
  optim: "adamw_8bit"

data:
  train_path: "data/sft_train.jsonl"
  val_path: "data/sft_val.jsonl"

output:
  dir: "models/qwen2.5_14b_bioreview_v1"

inference:
  temperature: 0.1
  max_new_tokens: 4096
  repetition_penalty: 1.05
